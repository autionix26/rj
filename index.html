
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessDeal | Private B2B Facilitation</title>
    
    <!-- Pro-Grade Preloads & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0A1A12', 
                black: '#020504',
                gold: '#C5A059', 
                surface: '#0E2519',
                border: 'rgba(255, 255, 255, 0.08)'
              }
            },
            fontFamily: {
              serif: ['"Instrument Serif"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            letterSpacing: {
              'pro-wide': '0.4em',
              'pro-tight': '-0.02em',
            },
            boxShadow: {
              'soft-glow': '0 0 30px rgba(197, 160, 89, 0.15)',
              'depth': '0 40px 100px -20px rgba(0, 0, 0, 0.7)',
            }
          }
        }
      }
    </script>
    
    <style>
        body { 
          background-color: #0A1A12; 
          color: #FFFFFF; 
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
        }

        .section-reveal {
          opacity: 0;
          transform: translateY(20px);
          transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1), transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .section-reveal.visible {
          opacity: 1;
          transform: translateY(0);
        }

        .nav-link-underline::after {
          content: '';
          position: absolute;
          width: 0;
          height: 1px;
          bottom: -4px;
          left: 0;
          background-color: #C5A059;
          transition: width 0.3s ease;
        }
        .nav-link-underline:hover::after {
          width: 100%;
        }

        /* Standardized scrollbar for pro look */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0A1A12; }
        ::-webkit-scrollbar-thumb { background: #1A2E24; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #C5A059; }

        @keyframes marquee { 
          0% { transform: translateX(0); } 
          100% { transform: translateX(-50%); } 
        }
        .animate-marquee { 
          animation: marquee 50s linear infinite; 
        }
        
        /* Typography Polish */
        .reveal-h1 {
          background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.6) 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
    </style>
<script type="importmap">

  }
}
</script>
</head>
<body class="selection:bg-brand-gold selection:text-brand-dark">

</body>
</html>
