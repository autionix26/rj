
<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessDeal | Private B2B Connector</title>
    
    <!-- Critical Preloads -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1530026405186-ed1f139313f8?fm=webp&q=75&w=600" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#123524',
                dark: '#051111',
                black: '#020707',
                gold: '#C5A059',
                light: '#FDFCFB'
              }
            },
            fontFamily: {
              serif: ['"Instrument Serif"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    
    <style>
        :root {
          --brand-green: #123524;
          --brand-gold: #C5A059;
        }
        
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #051111; 
          color: #FFFFFF; 
          -webkit-font-smoothing: antialiased;
          margin: 0;
          overflow-x: hidden;
        }

        /* High-End Grain Texture Overlay */
        body::before {
          content: "";
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          pointer-events: none;
          z-index: 9999;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
          opacity: 0.03;
        }

        .section-fade-in {
          opacity: 0;
          transform: translateY(20px);
          transition: opacity 1s cubic-bezier(0.25, 0.1, 0.25, 1), transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .section-visible {
          opacity: 1;
          transform: translateY(0);
        }

        @keyframes marquee { 
          0% { transform: translate3d(0, 0, 0); } 
          100% { transform: translate3d(-50%, 0, 0); } 
        }
        .animate-marquee { 
          animation: marquee 100s linear infinite; 
          will-change: transform;
        }

        @keyframes heartbeat {
          0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 0px rgba(197,160,89,0)); }
          15% { transform: scale(1.15); opacity: 0.9; filter: drop-shadow(0 0 8px rgba(197,160,89,0.5)); }
          30% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px rgba(197,160,89,0.2)); }
          45% { transform: scale(1.1); opacity: 0.9; filter: drop-shadow(0 0 6px rgba(197,160,89,0.4)); }
          100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 0px rgba(197,160,89,0)); }
        }
        .animate-heartbeat {
          animation: heartbeat 4s ease-in-out infinite;
        }
        
        ::selection {
          background: #C5A059;
          color: #051111;
        }

        .glass-header {
          background: rgba(5, 17, 17, 0.85);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020707; }
        ::-webkit-scrollbar-thumb { background: #123524; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #C5A059; }
    </style>

</head>
